[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pdukit"
dynamic = ["version"]   # from the latest git tag (setuptools-scm)
description = "COG: detect protein dynamical units (PDUs) from molecular dynamics trajectories"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Sarath Chandra Dantu" }]
keywords = ["molecular dynamics", "protein dynamics", "allostery", "Koopman", "tICA"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "threadpoolctl>=3.1",
]

[project.optional-dependencies]
gpu = ["torch>=2.3"]                    # batched GPU scoring (flux/engine_torch.py); CPU path needs only numpy
xtc = ["MDAnalysis>=2.5"]               # read XTC/DCD trajectories (pdu run -f ... .xtc)
mdcath = ["h5py>=3.9", "fsspec", "aiohttp"]   # mdCATH .h5 input
plot = ["matplotlib>=3.7"]                 # pdu plot units / lag / network / compare / movie (movie also needs ffmpeg)
notebook = ["pandas>=1.5", "py3Dmol>=2.0", "ipython", "matplotlib>=3.7"]   # Colab / Jupyter: result.table(), result.view()
dev = ["pytest>=7", "ruff", "matplotlib>=3.7", "import-linter>=2.0", "pandas>=1.5", "MDAnalysis>=2.5", "nbmake", "py3Dmol>=2.0", "ipython"]

[project.scripts]
pdu = "pdukit.cli.main:main"
# older names, kept as aliases
pdu-cog2 = "pdukit.cli.main:cog2_main"
pdu-cog2-summarise = "pdukit.analysis.summary:main"

[tool.setuptools_scm]
version_file = "pdukit/_version.py"   # written at install; not committed
tag_regex = "^v(?P<version>.+)$"

[tool.setuptools.packages.find]
include = ["pdukit*"]

[tool.setuptools.package-data]
pdukit = ["params/*.ppf", "params/tau_scan/*.ppf", "params/tau_scan/*.json"]

[tool.pytest.ini_options]
testpaths = ["pdukit/tests"]
addopts = "-ra"

[tool.ruff]
line-length = 79

[tool.ruff.lint]
# PEP 8 (E, W, N), PEP 257 (D), pyflakes (F), sorted imports (I)
select = ["E", "W", "F", "N", "D", "I"]
ignore = [
    "N803",  # argument names follow the maths (C, A, S, E, ...)
    "N806",  # local names follow the maths
    "D205",  # legacy multi-line summaries, being tidied module by module
    "D203",
    "D213",
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["D"]
"pdukit/config/schema.py" = ["E501"]
"pdukit/viz/*.py" = ["E501"]  # dense plotting layout

[project.urls]
Homepage = "https://github.com/scdantu/pdukit"
Issues = "https://github.com/scdantu/pdukit/issues"

[tool.importlinter]
root_package = "pdukit"

[[tool.importlinter.contracts]]
name = "layers: higher packages may import lower ones, never the reverse"
type = "layers"
layers = [
    "pdukit.cli",
    "pdukit.runner",
    "pdukit.result",
    "pdukit.cog",
    "pdukit.viz",
    "pdukit.analysis",
    "pdukit.config",
    "pdukit.io",
    "pdukit.model",
    "pdukit.bench",
    "pdukit.numerics",
]
